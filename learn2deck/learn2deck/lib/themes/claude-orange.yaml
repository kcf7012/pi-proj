# themes/claude-orange.yaml
# Claude Code Plugin 學習系列風格（橘+米白）
# 從 pi-proj/_pptx_helpers.py 移植
name: claude-orange
description: Claude Code Plugin 學習系列風格（橘+米白）

colors:
  primary: "#C75A1A"        # Claude 橘
  dark: "#2C2C2C"           # 深灰（主要文字）
  bg_cream: "#FAF8F3"       # 米白（背景）
  bg_gray: "#F3F0E9"        # 淺米（卡片背景）
  blue: "#3B82F6"           # 輔助藍
  green: "#16A34A"          # 強調綠
  red: "#DC2626"            # 警告紅
  white: "#FFFFFF"
  gray_text: "#6B6B6B"      # 次要文字
  code_bg: "#1E1E1E"        # 程式碼區塊背景
  code_fg: "#E6E6E6"        # 程式碼前景

fonts:
  title: "Calibri"
  body: "Calibri"
  mono: "Consolas"

font_sizes:
  cover_title: 54
  cover_subtitle: 22
  slide_title: 32
  slide_subtitle: 16
  body: 14
  code: 12
  callout: 13
  brand: 9
  section_num: 96
  section_title: 40
  section_subtitle: 18

layout:
  # 簡報尺寸
  slide_width: 13.333
  slide_height: 7.5

  # 安全區域
  content_top: 1.3
  content_bottom: 7.0
  brand_y: 7.1

  # 標題列
  title_top: 0.3
  title_height: 0.7
  subtitle_top: 1.0
  subtitle_height: 0.4

  # 內邊距
  content_left: 0.5
  content_right_margin: 0.5
  column_gap: 0.13

decorations:
  top_accent_bar:
    enabled: true
    height: 0.15
    color: primary
  brand_text:
    left: "Claude Code Plugin 完整學習系列"
    right_template: "📖 來源：{source}"
